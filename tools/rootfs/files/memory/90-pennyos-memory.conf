# pennyos: swap tuning for zram (see /etc/systemd/zram-generator.conf).
# Getting a page back from zram is cheaper than reading a dropped file page from
# the eMMC, so swap anonymous memory as readily as the kernel drops page cache.
vm.swappiness = 100
# zram has no seek cost; reading ahead neighbouring pages only wastes RAM
vm.page-cluster = 0
