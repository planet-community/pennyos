# pennyos: compressed swap in RAM, used before the swap file on the eMMC.
# Half of RAM (about 2.9 GiB on the 6 GB Cosmo); zstd packs typical desktop memory
# about 3:1, so a full device costs roughly 1 GiB of real RAM.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
