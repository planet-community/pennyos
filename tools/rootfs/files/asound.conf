# ALSA default device for the Cosmo (card "cosmo", kernel/drivers/cosmo-sound.c).
#
# Playback: software volume ("Master", what penny-volume and the volume keys move)
# over dmix, so several programs can play at once. The codec's own "Lineout
# Volume" only spans -10..+8 dB, too narrow for a volume control; penny-sound-setup
# leaves it fixed and this does the rest. Capture: the codec's capture device.
pcm.!default {
	type asym
	playback.pcm "penny_playback"
	capture.pcm "plughw:cosmo,1"
}

pcm.penny_playback {
	type plug
	slave.pcm "penny_softvol"
}

pcm.penny_softvol {
	type softvol
	slave.pcm "penny_dmix"
	control {
		name "Master Playback Volume"
		card cosmo
	}
	min_dB -50.0
	max_dB 0.0
}

pcm.penny_dmix {
	type dmix
	ipc_key 7121
	ipc_perm 0666
	slave {
		pcm "hw:cosmo,0"
		format S16_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 4096
	}
}

ctl.!default {
	type hw
	card cosmo
}
