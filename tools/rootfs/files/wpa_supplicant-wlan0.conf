# Saved Wi-Fi networks for wlan0. Edited by the bar's Wi-Fi menu and by
# penny-wifi-connect (through wpa_cli save_config): add networks there, not here.
# Without this file wpa_supplicant@wlan0 does not start, and no menu can scan.
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=1
